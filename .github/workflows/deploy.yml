name: Deploy Neuromafia to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYMENT_OK.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark successful deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'deployed_at=%s\npage_url=%s\ncommit=%s\n' "$(date -u +%FT%TZ)" "$PAGE_URL" "$GITHUB_SHA" > DEPLOYMENT_OK.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEPLOYMENT_OK.txt
          git commit -m 'Mark successful deployment [skip pages]' || exit 0
          git push origin HEAD:main
