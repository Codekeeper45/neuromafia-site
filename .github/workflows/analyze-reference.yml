name: Analyze public UI reference

# Triggered for a visual evidence refresh on 2026-08-04.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/analyze-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture public interface evidence
        env:
          TARGET_URL: https://mafiia-ot-svety.onrender.com/
        run: |
          mkdir -p analysis/reference/screens analysis/reference/assets
          cat > /tmp/analyze.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const out = 'analysis/reference';
          const target = process.env.TARGET_URL;
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1,locale:'ru-RU',colorScheme:'dark'});
          const page = await context.newPage();
          const consoleLog=[]; const requests=[];
          page.on('console',m=>consoleLog.push({type:m.type(),text:m.text()}));
          page.on('request',r=>requests.push({url:r.url(),method:r.method(),type:r.resourceType()}));
          const response = await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForTimeout(15000);
          await page.screenshot({path:`${out}/screens/desktop.png`,fullPage:true});
          await fs.writeFile(`${out}/screens/desktop.b64`,(await fs.readFile(`${out}/screens/desktop.png`)).toString('base64'));
          const pageData = await page.evaluate(()=>{
            const visible=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'};
            const clean=s=>(s||'').replace(/\s+/g,' ').trim().slice(0,500);
            const nodes=[...document.querySelectorAll('body *')].filter(visible);
            const interactive=[...document.querySelectorAll('button,a,input,select,textarea,[role=button],[tabindex]')].filter(visible).map((el,i)=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{i,tag:el.tagName.toLowerCase(),text:clean(el.innerText||el.getAttribute('aria-label')||el.getAttribute('placeholder')||el.value),href:el.href||'',type:el.type||'',id:el.id||'',classes:el.className?.toString().slice(0,200)||'',box:{x:r.x,y:r.y,w:r.width,h:r.height},style:{background:s.background,backgroundColor:s.backgroundColor,color:s.color,border:s.border,borderRadius:s.borderRadius,font:s.font,boxShadow:s.boxShadow}}});
            const major=nodes.filter(el=>{const r=el.getBoundingClientRect();return r.width>180&&r.height>70}).slice(0,500).map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return{tag:el.tagName.toLowerCase(),id:el.id||'',classes:el.className?.toString().slice(0,200)||'',text:clean(el.innerText),box:{x:r.x,y:r.y,w:r.width,h:r.height},style:{position:s.position,display:s.display,background:s.background,backgroundColor:s.backgroundColor,color:s.color,border:s.border,borderRadius:s.borderRadius,font:s.font,boxShadow:s.boxShadow,backdropFilter:s.backdropFilter}}});
            const cssVars={};const root=getComputedStyle(document.documentElement);for(const n of root){if(n.startsWith('--'))cssVars[n]=root.getPropertyValue(n).trim()}
            const colors={};for(const el of nodes.slice(0,1800)){const s=getComputedStyle(el);for(const v of [s.color,s.backgroundColor,s.borderTopColor])if(v&&v!=='rgba(0, 0, 0, 0)')colors[v]=(colors[v]||0)+1}
            return{title:document.title,url:location.href,bodyText:clean(document.body.innerText).slice(0,25000),html:document.documentElement.outerHTML,interactive,major,cssVars,colors:Object.entries(colors).sort((a,b)=>b[1]-a[1]).slice(0,100),fonts:[...new Set(nodes.map(el=>getComputedStyle(el).fontFamily))].slice(0,50),viewport:{w:innerWidth,h:innerHeight,scrollHeight:document.documentElement.scrollHeight}};
          });
          await fs.writeFile(`${out}/page.json`,JSON.stringify({...pageData,status:response?.status(),headers:response?await response.allHeaders():{}},null,2));
          await fs.writeFile(`${out}/page.html`,pageData.html);
          await fs.writeFile(`${out}/requests.json`,JSON.stringify(requests,null,2));
          await fs.writeFile(`${out}/console.json`,JSON.stringify(consoleLog,null,2));
          const resources=await page.evaluate(async()=>{const urls=[...new Set([...document.scripts].map(x=>x.src).filter(Boolean).concat([...document.querySelectorAll('link[rel=stylesheet]')].map(x=>x.href).filter(Boolean)))];const out=[];for(const url of urls){try{const r=await fetch(url);const text=await r.text();out.push({url,status:r.status,type:r.headers.get('content-type'),text:text.slice(0,500000)})}catch(e){out.push({url,error:String(e)})}}return out});
          await fs.writeFile(`${out}/resources.json`,JSON.stringify(resources.map(({text,...x})=>({...x,size:text?.length||0})),null,2));
          for(const [i,r] of resources.entries())if(r.text){const ext=(r.type||'').includes('css')?'css':'js';await fs.writeFile(`${out}/assets/${String(i).padStart(2,'0')}.${ext}`,r.text)}
          const candidates=pageData.interactive.filter(x=>x.tag==='button'&&x.text).slice(0,30);
          const states=[];
          for(const [index,item] of candidates.entries()){
            const p=await context.newPage();
            try{await p.goto(target,{waitUntil:'domcontentloaded',timeout:120000});await p.waitForTimeout(7000);const buttons=p.locator('button');const count=await buttons.count();let clicked=false;for(let i=0;i<count;i++){const text=((await buttons.nth(i).innerText().catch(()=>''))||'').replace(/\s+/g,' ').trim();if(text===item.text){await buttons.nth(i).click({timeout:5000}).catch(()=>{});clicked=true;break}}if(clicked){await p.waitForTimeout(3000);const file=`${out}/screens/state-${String(index).padStart(2,'0')}.png`;await p.screenshot({path:file,fullPage:true});await fs.writeFile(file.replace('.png','.b64'),(await fs.readFile(file)).toString('base64'));states.push({button:item.text,url:p.url(),title:await p.title(),text:(await p.locator('body').innerText()).replace(/\s+/g,' ').trim().slice(0,8000)})}}catch(e){states.push({button:item.text,error:String(e)})}finally{await p.close()}}
          await fs.writeFile(`${out}/states.json`,JSON.stringify(states,null,2));
          const summary={target,capturedAt:new Date().toISOString(),title:pageData.title,status:response?.status(),interactiveCount:pageData.interactive.length,resourceCount:resources.length,stateCount:states.length,sha256:crypto.createHash('sha256').update(pageData.html).digest('hex')};
          await fs.writeFile(`${out}/summary.json`,JSON.stringify(summary,null,2));
          await browser.close();
          EOF
          node /tmp/analyze.mjs
      - name: Commit analysis artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/reference
          git commit -m "Capture public UI reference evidence" || exit 0
          git push
