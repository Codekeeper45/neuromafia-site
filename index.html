<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0910"><title>Базария 4.0 — запуск</title><style>:root{color-scheme:dark;--a:#f0785d;--b:#9d7bff;--bg:#0b0910}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#2b1826,transparent 38%),radial-gradient(circle at 80% 80%,#201b3c,transparent 36%),var(--bg);color:#fff;font-family:system-ui}.w{width:min(560px,88vw);text-align:center}.face{width:102px;height:86px;margin:0 auto 25px;border-radius:25px;background:linear-gradient(145deg,#ffab82,#e76958);position:relative;box-shadow:0 18px 55px #f0785d44;animation:f 2s ease-in-out infinite}.face:before,.face:after{content:"";position:absolute;top:28px;width:25px;height:28px;border-radius:50%;background:#fff}.face:before{left:19px}.face:after{right:19px}.face i,.face b{position:absolute;top:38px;width:7px;height:9px;border-radius:50%;background:#34272b;z-index:2}.face i{left:29px}.face b{right:29px}.face em{position:absolute;left:37px;bottom:13px;width:28px;height:10px;border-bottom:3px solid #6c3840;border-radius:50%}h1{font-size:clamp(30px,7vw,54px);margin:0;letter-spacing:-.04em}h1 span{color:#ff9d7f}p{color:#a79daa;min-height:46px}.track{height:8px;border-radius:99px;background:#211a29;overflow:hidden}.track i{display:block;width:2%;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:.2s}.hint{margin-top:14px;color:#6f6878;font:10px ui-monospace,monospace;letter-spacing:.12em}@keyframes f{50%{transform:translateY(-7px)}}button{padding:10px 14px;border:1px solid #ffffff22;border-radius:11px;background:#211a29;color:#fff}</style></head><body><main class="w"><div class="face"><i></i><b></b><em></em></div><h1>БАЗАРИЯ <span>4.0</span></h1><p id="s">Подключаем социальную ИИ-мафию…</p><div class="track"><i id="p"></i></div><div class="hint">SOCIAL MAFIA · CLEAN-ROOM UI · 100 MODULES</div></main><script>(async()=>{const s=document.getElementById('s'),p=document.getElementById('p');try{if(!('DecompressionStream'in window))throw new Error('Нужен современный браузер');let e='';for(let i=0;i<4;i++){const n=String(i).padStart(2,'0'),r=await fetch('https://raw.githubusercontent.com/Codekeeper45/neuromafia-site/main/payload/'+n+'.txt?build=4.0',{cache:'no-store'});if(!r.ok)throw new Error('Не загрузилась часть '+n);e+=(await r.text()).trim();s.textContent='Загрузка комнаты: '+(i+1)+' из 4';p.style.width=((i+1)*21)+'%'}s.textContent='Распаковываем Базарию 4.0…';p.style.width='93%';const raw=atob(e),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const h=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!h.includes('<title>Базария 4.0'))throw new Error('Проверка сборки не пройдена');p.style.width='100%';s.textContent='Комната готова';await new Promise(r=>setTimeout(r,120));document.open();document.write(h);document.close()}catch(x){s.innerHTML='Ошибка запуска: '+x.message+'<br><button onclick="location.reload()">Повторить</button>';p.style.width='100%';console.error(x)}})()</script></body></html>
