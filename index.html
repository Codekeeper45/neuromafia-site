<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05060b"><title>НЕЙРОМАФИЯ</title><style>html,body{margin:0;height:100%;background:#05060b;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.l{text-align:center}.b{width:min(360px,75vw);height:3px;background:#241a36;overflow:hidden;margin:18px auto}.b i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#ff38c8,#33d9f0);transition:.2s}small{color:#a396c2}</style></head><body><div class="l"><h1>НЕЙРОМАФИЯ</h1><div id="s">Загрузка вселенной…</div><div class="b"><i id="p"></i></div><small>NEUROMAFIA</small></div><script type="module">const s=document.querySelector('#s'),p=document.querySelector('#p');try{if(!('DecompressionStream'in window))throw new Error('Нужен современный браузер');let b='';for(let i=0;i<4;i++){const n=String(i).padStart(2,'0');const r=await fetch('./payload/'+n+'.txt?v=neuromafia-20260813',{cache:'no-store'});if(!r.ok)throw new Error('Не загрузилась часть '+n);b+=(await r.text()).trim();p.style.width=((i+1)*20)+'%';s.textContent='Загрузка: '+(i+1)+'/4'}const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(stream).text();if(!h.includes('НЕЙРОМАФИЯ'))throw new Error('Проверка сборки не пройдена');p.style.width='100%';s.textContent='Готово';document.open();document.write(h);document.close()}catch(e){s.textContent='Ошибка запуска: '+e.message;console.error(e)}</script></body></html>
