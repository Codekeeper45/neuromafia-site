<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Базария 3.0 — запуск</title><style>:root{color-scheme:dark;--cyan:#37e4ff;--gold:#ffc85c;--bg:#080b12;--dim:#96a4bd}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#14233d 0,transparent 36%),radial-gradient(circle at 80% 80%,#25162f 0,transparent 34%),var(--bg);color:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(620px,88vw);text-align:center}.toast{width:120px;height:95px;margin:0 auto 28px;border-radius:22px;background:linear-gradient(145deg,#a9ddd2,#5e8e89);border:4px solid #456b68;position:relative;box-shadow:0 0 42px #37e4ff44;animation:float 2.2s ease-in-out infinite}.toast:before,.toast:after{content:"";position:absolute;top:36px;width:28px;height:30px;border-radius:50%;background:#fff;border:2px solid #5f5550}.toast:before{left:20px}.toast:after{right:20px}.toast i,.toast b{position:absolute;top:47px;width:8px;height:10px;border-radius:50%;background:#342a27;z-index:2}.toast i{left:31px}.toast b{right:31px}.toast em{position:absolute;left:43px;bottom:13px;width:34px;height:12px;border-bottom:3px solid #465052;border-radius:50%}h1{margin:0;font-size:clamp(30px,7vw,54px);letter-spacing:.09em}h1 span{color:var(--cyan)}#status{min-height:48px;color:var(--dim);line-height:1.5}.track{height:8px;overflow:hidden;border:1px solid #7080aa33;border-radius:99px;background:#101528}.track i{display:block;width:2%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .2s}.hint{margin-top:16px;font:11px ui-monospace,monospace;color:#65718d}@keyframes float{50%{transform:translateY(-8px)}}</style></head><body><main class="wrap"><div class="toast"><i></i><b></b><em></em></div><h1>БАЗАРИЯ <span>3.0</span></h1><p id="status">Подключаем 100 модулей…</p><div class="track"><i id="bar"></i></div><div class="hint">SHA-256 fb6c681be3d29938…62a94a5dd5a1dae5</div></main><script>(async()=>{const status=document.getElementById('status'),bar=document.getElementById('bar');try{if(!('DecompressionStream'in window))throw new Error('Нужен современный браузер');let encoded='';const count=4;for(let i=0;i<count;i++){const part=String(i).padStart(2,'0'),r=await fetch('payload/'+part+'.txt?3.0',{cache:'no-store'});if(!r.ok)throw new Error('Не загрузилась часть '+part);encoded+=(await r.text()).trim();status.textContent='Загрузка Базарии: '+(i+1)+' из '+count;bar.style.width=Math.round((i+1)/count*82)+'%'}status.textContent='Распаковываем игровую экосистему…';bar.style.width='92%';const raw=atob(encoded),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('<title>Базария 3.0'))throw new Error('Проверка целостности не пройдена');bar.style.width='100%';status.textContent='Базария открыта';await new Promise(r=>setTimeout(r,150));document.open();document.write(html);document.close()}catch(e){status.textContent='Ошибка запуска: '+e.message;bar.style.width='100%';console.error(e)}})()</script></body></html>
